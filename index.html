<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея bento</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="gallery-layout">
    <aside class="aside">
      <div class="aside-content">
        <h1 class="aside-content__title">Відкрийте природу</h1>
        <p class="aside-content__count">Перегляньте місця, відібрані фотографами з усього світу. Дослідіть гори, ліси, пляжі та міста.</p>
      </div>
      <div class="aside-badges">
        <ul class="badges-list">
          <li class="badges-list__item">
            <button class="badges-list__btn" type="button">
              <span>🏔</span>
              <span>Гори</span>
            </button>
          </li>
          <li class="badges-list__item">
            <button class="badges-list__btn" type="button">
              <span>🌊</span>
              <span>Океан</span>
            </button>
          </li>
          <li class="badges-list__item">
            <button class="badges-list__btn" type="button">
              <span>🌲</span>
              <span>Ліс</span>
            </button>
          </li>
          <li class="badges-list__item">
            <button class="badges-list__btn" type="button">
              <span>🏙</span>
              <span>Города</span>
            </button>
          </li>
          <li class="badges-list__item">
            <button class="badges-list__btn" type="button">
              <span>🌵</span>
              <span>Пустыня</span>
            </button>
          </li>
        </ul>
      </div>
    </aside>
    <main class="bento-gallery">
      <article class="bento-card bento-card--wide">
        <img class="bento-card__bg" src="img/pic_1.png" alt="Швейцарські альпи">
        <div class="bento-card__overlay"></div>
        <div class="bento-card__content">
            <h3 class="bento-card__title">Швейцарські альпи</h3>
            <p class="bento-card__count">42 фотографії</p>
        </div>
      </article>
      <article class="bento-card">
        <img class="bento-card__bg" src="img/pic_2.png" alt="Океан">
        <div class="bento-card__overlay"></div>
          <div class="bento-card__content">
            <h3 class="bento-card__title">Океан</h3>
            <p class="bento-card__count">18 фотографій</p>
          </div>
      </article>
      <article class="bento-card">
        <img class="bento-card__bg" src="img/pic_3.png" alt="Ліс">
        <div class="bento-card__overlay"></div>
          <div class="bento-card__content">
            <h3 class="bento-card__title">Ліс</h3>
            <p class="bento-card__count">27 фотографій</p>
          </div>
      </article>
      <article class="bento-card">
        <img class="bento-card__bg" src="img/pic_4.png" alt="Токіо">
        <div class="bento-card__overlay"></div>
          <div class="bento-card__content">
            <h3 class="bento-card__title">Токіо</h3>
            <p class="bento-card__count">31 фотографія</p>
          </div>
      </article>
      <article class="bento-card">
        <img class="bento-card__bg" src="img/pic_5.png" alt="Пляж">
        <div class="bento-card__overlay"></div>
          <div class="bento-card__content">
            <h3 class="bento-card__title">Пляж</h3>
            <p class="bento-card__count">15 фотографій</p>
          </div>
      </article>
      <article class="bento-card bento-card--wide">
        <img class="bento-card__bg" src="img/pic_6.png" alt="Ріка">
        <div class="bento-card__overlay"></div>
          <div class="bento-card__content">
            <h3 class="bento-card__title">Ріка</h3>
            <p class="bento-card__count">56 фотографій</p>
          </div>
      </article>
      <article class="bento-card bento-card--wide">
        <img class="bento-card__bg" src="img/pic_7.png" alt="Пустеля">
        <div class="bento-card__overlay"></div>
          <div class="bento-card__content">
            <h3 class="bento-card__title">Пустеля</h3>
            <p class="bento-card__count">13 фотографій</p>
          </div>
      </article>
      <article class="bento-card bento-card--wide">
        <img class="bento-card__bg" src="img/pic_8.png" alt="Сніг">
        <div class="bento-card__overlay"></div>
          <div class="bento-card__content">
            <h3 class="bento-card__title">Сніг</h3>
            <p class="bento-card__count">28 фотографій</p>
          </div>
      </article>
    </main>
    </div>
  </body>
</html>
